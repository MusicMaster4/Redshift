name: Release

on:
  push:
    branches: [main, testing]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment from the latest stable release
        type: choice
        default: patch
        options: [patch, minor, major]
      publish:
        description: Publish the release
        type: boolean
        default: true

run-name: ${{ github.ref_name == 'main' && 'Stable' || 'Beta' }} release from ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BETA_POINTER_TAG: channel-testing

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - name: Resolve channel and version
        id: resolve
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          bun scripts/release-version.mjs --branch "$GITHUB_REF_NAME" --bump "${BUMP:-patch}"
          echo "publish=${PUBLISH:-true}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate source
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile
      - run: bun scripts/apply-version.mjs --version "${{ needs.version.outputs.version }}" --channel "${{ needs.version.outputs.channel }}" --repo "$GITHUB_REPOSITORY"
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  desktop:
    name: Build ${{ matrix.name }}
    needs: [version, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows
            runner: windows-latest
            bundles: nsis
            target_args: ""
            rust_targets: ""
            bundle_dir: src-tauri/target/release/bundle
          - name: macOS universal
            platform: macos
            runner: macos-latest
            bundles: app,dmg
            target_args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}
      - run: bun install --frozen-lockfile
      - name: Stamp version and update feed
        run: bun scripts/apply-version.mjs --version "${{ needs.version.outputs.version }}" --channel "${{ needs.version.outputs.channel }}" --repo "$GITHUB_REPOSITORY"

      - name: Configure optional macOS signing
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          test -n "${APPLE_CERTIFICATE_PASSWORD:-}"
          test -n "${KEYCHAIN_PASSWORD:-}"
          test -n "${CONFIGURED_IDENTITY:-}"
          KEYCHAIN="$RUNNER_TEMP/redshift-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/redshift-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/redshift-certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "APPLE_SIGNING_IDENTITY=$CONFIGURED_IDENTITY" >> "$GITHUB_ENV"

      - name: Build installer and signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID || true
          fi
          bun run tauri build --bundles "${{ matrix.bundles }}" ${{ matrix.target_args }}

      - name: Stage desktop assets
        env:
          PLATFORM: ${{ matrix.platform }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          stage_files() {
            local directory="$1"
            local file
            for file in "$directory"/*; do
              [ -f "$file" ] && cp "$file" release-assets/
            done
          }
          if [ "$PLATFORM" = "windows" ]; then
            stage_files "$BUNDLE_DIR/nsis"
            INSTALLER="$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
            test -n "$INSTALLER"
            if [ "$CHANNEL" = "testing" ]; then
              cp "$INSTALLER" release-assets/redshift-beta-setup.exe
            else
              cp "$INSTALLER" release-assets/redshift-setup.exe
            fi
          else
            DMG_SOURCE="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            test -n "$DMG_SOURCE"
            cp "$DMG_SOURCE" release-assets/
            UPDATER="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
            test -n "$UPDATER"
            test -f "$UPDATER.sig"
            STAGED="release-assets/Redshift_${VERSION}_universal.app.tar.gz"
            cp "$UPDATER" "$STAGED"
            cp "$UPDATER.sig" "$STAGED.sig"
            DMG="release-assets/$(basename "$DMG_SOURCE")"
            if [ "$CHANNEL" = "testing" ]; then
              cp "$DMG" release-assets/redshift-beta.dmg
            else
              cp "$DMG" release-assets/redshift.dmg
            fi
          fi
          find release-assets -maxdepth 1 -type f -print
      - uses: actions/upload-artifact@v5
        with:
          name: redshift-release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 2

  assemble:
    name: Assemble release
    needs: [version, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - uses: actions/download-artifact@v5
        with:
          pattern: redshift-release-*
          path: release-assets
          merge-multiple: true
      - name: Create desktop manifest
        run: |
          set -euo pipefail
          bun scripts/updater-manifest.mjs \
            --version "${{ needs.version.outputs.version }}" \
            --tag "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle-dir release-assets \
            --notes "$(git log -1 --pretty=%s)"
      - name: Create draft and upload assets
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$CHANNEL" = "testing" ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Redshift $TAG (beta)" --generate-notes
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Redshift $TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" release-assets/* latest.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Keep an unpublished test build
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: redshift-${{ needs.version.outputs.channel }}-${{ needs.version.outputs.version }}
          path: |
            release-assets/*
            latest.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, assemble]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      REPO: ${{ github.repository }}
    steps:
      - name: Publish stable
        if: env.CHANNEL == 'stable'
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
      - name: Publish beta
        if: env.CHANNEL == 'testing'
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false
      - name: Refresh permanent beta downloads
        if: env.CHANNEL == 'testing'
        run: |
          set -euo pipefail
          mkdir beta-channel
          gh release download "$TAG" --repo "$REPO" \
            --pattern latest.json \
            --pattern redshift-beta-setup.exe \
            --pattern redshift-beta.dmg \
            --dir beta-channel
          if ! gh release view "$BETA_POINTER_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$BETA_POINTER_TAG" --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
              --title "Redshift beta channel" \
              --notes "Permanent update feed and downloads for the newest Redshift beta."
          fi
          gh release upload "$BETA_POINTER_TAG" beta-channel/* --repo "$REPO" --clobber
